<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <script type="module" src="./js/2-form.js"></script>
  <script type="module" src="./js/color-theme.js"></script>
</head>

<body data-color-scheme='light'>
  <header class="header">
    <div class="container page-header-container">
      <nav class="nav">
        <ul class="nav-list">
          <li class="nav-item"><a class="nav-link" href="./1-gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="./2-form.html">Form</a></li>
        </ul>
      </nav>
      <div class="theme-toggle">
        <input class="toggle-checkbox visually-hidden js-toggle-checkbox" type="checkbox" id="theme-toggle" />
        <label class="toggle-container" for="theme-toggle">
          <span class="toggle-icon"></span>
        </label>
      </div>
    </div>
  </header>


  <main>
    <div class="container">
      <form class="feedback-form" autocomplete="off">
        <label class="label">
          Email
          <input class="feedback-form-input" placeholder="Enter an email" type="email" name="email" autofocus />
        </label>
        <label class="label">
          Message
          <textarea class="feedback-form-message" name="message" placeholder="Enter a message" rows="8"></textarea>
        </label>
        <button class="feedback-form-submit" type="submit">Submit</button>
      </form>
    </div>
  </main>
  <!-- <script src="./js/2-form.js"></script> -->
</body>

</html>
